<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#0a1428">
<title>World Cup 2026 Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFD700;--gold2:#FFA500;--green:#00c97a;--blue:#4a9eff;
  --live:#ff4444;--bg:#0a1428;--bg2:#1a3a52;--bg3:#0f2235;
  --border:#FFD700;--text:#dde5f5;--muted:#7a95b8;
  --tur:#c0392b;--tur-bg:rgba(192,57,43,.18)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);
  font-family:'Roboto Condensed',sans-serif}

/* FIXED HEADER */
#hdr{display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,var(--bg3) 0%,#051e3e 100%);
  border-bottom:2px solid var(--gold);padding:8px 12px;height:52px;gap:8px;flex-shrink:0}
.hl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.trophy{font-size:22px}
.tm{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--gold);letter-spacing:1px}
.ts{font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
#cdblock{text-align:center;flex-shrink:0}
#cd{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;color:var(--gold)}
.cdf{font-size:8px;color:var(--muted)}
.hr{text-align:right;flex-shrink:0}
#clk{font-family:'Oswald',sans-serif;font-size:14px;color:var(--text)}
#dt{font-size:8px;color:var(--muted)}
#upd{font-size:7px;color:#3a4a65;margin-top:1px}

/* MAIN VIEWPORT */
#viewport{display:flex;flex-direction:column;height:calc(100vh - 52px - 48px);overflow:hidden}

/* CONTENT AREA */
#content{display:flex;flex-direction:column;height:100%;overflow-y:auto;padding:8px;gap:6px}

/* TOP ROW: GROUPS + SCORERS */
#top-row{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;flex-shrink:0;height:auto;min-height:140px}

/* GROUPS PANEL */
#groups-panel{background:var(--bg2);border:2px solid var(--gold);border-radius:4px;padding:6px;overflow-y:auto;max-height:140px}
.groups-header{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;color:var(--gold);
  margin-bottom:4px;letter-spacing:1px}
.groups-list{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.group-btn{background:var(--bg3);border:1px solid var(--border);border-radius:2px;padding:4px;
  cursor:pointer;transition:all .2s;text-align:center;font-family:'Oswald',sans-serif;
  font-size:9px;font-weight:700;color:var(--gold)}
.group-btn:hover{background:var(--bracket-hover);transform:scale(1.05)}
.group-btn.tur{background:var(--tur-bg)}

/* SCORERS PANEL */
#scorers-panel{background:var(--bg2);border:2px solid var(--gold);border-radius:4px;padding:6px;overflow-y:auto;max-height:140px}
.scorers-header{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;color:var(--gold);
  margin-bottom:4px;letter-spacing:1px}
.scorers-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.scorer-card{background:var(--bg3);border:1px solid var(--border);border-radius:2px;padding:2px;
  font-size:7px;line-height:1.3}
.sc-rank{color:var(--gold);font-weight:700}
.sc-name{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-team{color:var(--muted);font-size:6px}
.sc-club{color:var(--gold2);font-size:6px;font-style:italic}
.sc-goals{color:var(--green);font-weight:700;font-size:8px}

/* BRACKET CONTAINER */
#bracket-section{flex:1;display:flex;flex-direction:column;overflow:hidden}
.bracket-wrapper{display:flex;justify-content:center;align-items:center;flex:1;overflow:auto;padding:4px}

/* BRACKET LAYOUT */
.bracket-grid{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto;gap:8px;
  align-items:center;min-width:min-content}

/* BRACKET COLUMN */
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;min-height:500px}

/* BRACKET MATCH SEED */
.bracket-seed{background:var(--bg3);border:2px solid var(--border);border-radius:3px;
  padding:6px 8px;text-align:center;min-width:50px;cursor:pointer;transition:all .3s;
  position:relative;font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;
  color:var(--gold)}
.bracket-seed:hover{background:var(--bracket-hover);box-shadow:0 0 12px rgba(255,215,0,.4)}
.bracket-seed .seed{display:block;height:20px;line-height:20px}
.bracket-seed .score{display:none;font-size:7px;color:var(--live);margin-top:2px;font-weight:700}
.bracket-seed:hover .seed{display:none}
.bracket-seed:hover .score{display:block}
.bracket-seed.ft .score{color:var(--green)}
.bracket-seed.live{border-color:var(--live);box-shadow:0 0 8px rgba(255,68,68,.5);animation:pulse 1.5s infinite}
.bracket-seed.tur{border-color:var(--tur)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

/* CONNECTING LINES */
.bracket-line{width:2px;background:var(--gold);margin:0 4px}
.bracket-space{width:20px}

/* FINAL */
.bracket-final{background:var(--bg3);border:3px solid var(--gold);border-radius:6px;
  padding:12px 20px;text-align:center;min-width:100px;font-family:'Oswald',sans-serif;
  font-size:12px;font-weight:700;color:var(--gold);margin:0 auto}
.final-score{font-size:20px;color:var(--text);margin:8px 0}

/* TEAMS AT BOTTOM */
#teams-bottom{padding:6px;background:var(--bg2);border-top:2px solid var(--gold);
  overflow-x:auto;flex-shrink:0}
.teams-header{font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;color:var(--gold);
  margin-bottom:4px;letter-spacing:1px}
.teams-grid{display:flex;gap:2px;min-width:min-content}
.group-teams{display:flex;gap:2px}
.team-pill{display:flex;align-items:center;gap:2px;padding:3px 6px;background:var(--bg3);
  border:1px solid var(--border);border-radius:3px;font-size:7px;white-space:nowrap;
  cursor:pointer;transition:all .2s}
.team-pill:hover{border-color:var(--gold2);background:var(--bracket-hover)}
.team-pill .flag{font-size:9px}
.team-pill.tur{border-color:var(--tur)}

/* FIXED TICKER */
#tickers{height:48px;background:var(--bg2);border-top:2px solid var(--gold);
  display:flex;align-items:center;overflow:hidden;flex-shrink:0}
.tlabel{flex-shrink:0;width:100px;font-family:'Oswald',sans-serif;font-size:11px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:0 10px;
  border-right:2px solid var(--border);color:var(--gold)}
.twrap{flex:1;overflow:hidden;display:flex;align-items:center}
.ttrack{display:flex;align-items:center;white-space:nowrap;animation:sl 60s linear infinite}
.ti{font-size:14px;padding:0 24px;color:var(--text)}
@keyframes sl{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* OVERLAY */
#overlay{display:none;position:fixed;inset:0;z-index:200;
  background:rgba(3,8,18,.85);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:20px}
#overlay.open{display:flex}
#overlay-card{background:linear-gradient(160deg,var(--bg2),var(--bg));
  border:2px solid var(--gold);border-radius:12px;
  width:min(900px,90vw);max-height:85vh;overflow-y:auto;
  box-shadow:0 12px 60px rgba(0,0,0,.8);padding:20px}
#overlay-close{position:absolute;top:12px;right:14px;width:32px;height:32px;
  background:var(--bg3);color:var(--gold);border:1px solid var(--border);
  border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
#overlay-close:hover{border-color:var(--gold2);background:#222}
.ov-title{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;
  color:var(--gold);letter-spacing:1px;margin-bottom:12px}
.ov-section{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;
  color:var(--gold2);letter-spacing:.5px;text-transform:uppercase;
  margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.ovs-table{width:100%;border-collapse:collapse;font-size:12px}
.ovs-table th{color:var(--muted);text-transform:uppercase;letter-spacing:.3px;
  text-align:center;padding:6px 4px;border-bottom:1px solid var(--border);font-size:10px}
.ovs-table th.l{text-align:left}
.ovs-table td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--bg3)}
.ovs-table td.l{text-align:left}
.ovs-flag{font-size:16px}
.ovs-name{font-family:'Oswald',sans-serif;font-weight:600;color:#fff}
.ovs-pts{color:var(--gold);font-weight:700}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;gap:14px}
#loading .trophy-big{font-size:60px;animation:bounce 1.5s infinite}
#loading .lt{font-family:'Oswald',sans-serif;font-size:22px;color:var(--gold);letter-spacing:2px}
#loading .ls{font-size:13px;color:var(--muted)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

#err-banner{display:none;position:fixed;top:0;left:0;right:0;background:#3a0000;
  color:#ff7070;font-size:12px;padding:6px 14px;z-index:90;text-align:center;font-weight:700}

/* AUDIO BUTTON */
#audio-enable{position:fixed;bottom:70px;right:16px;z-index:95;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;
  border:none;border-radius:24px;padding:10px 18px;font-family:'Oswald',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5);
  animation:pulse-btn 2s infinite}
@keyframes pulse-btn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#audio-toggle{display:none;position:fixed;bottom:70px;right:16px;z-index:95;
  width:38px;height:38px;align-items:center;justify-content:center;
  background:var(--bg3);color:var(--gold);border:1px solid var(--border);
  border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#audio-toggle:hover{border-color:var(--gold)}

/* MOBILE */
@media (max-aspect-ratio:1/1){
  #top-row{grid-template-columns:1fr}
  .bracket-grid{grid-template-columns:auto auto auto}
  .scorers-grid{grid-template-columns:repeat(2,1fr)}
  #overlay-card{width:95vw}
}
</style>
</head>
<body>

<div id="loading">
  <div class="trophy-big">🏆</div>
  <div class="lt">FIFA WORLD CUP 2026</div>
  <div class="ls">Loading bracket…</div>
</div>

<div id="err-banner"></div>

<button id="audio-enable" onclick="enableAudio()">🔊 Alerts</button>
<button id="audio-toggle" onclick="toggleMute()" title="Mute">🔊</button>

<div id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div id="overlay-card">
    <button id="overlay-close" onclick="closeOverlay()">✕</button>
    <div id="overlay-content"></div>
  </div>
</div>

<div id="hdr">
  <div class="hl">
    <span class="trophy">🏆</span>
    <div>
      <div class="tm">FIFA WORLD CUP 2026</div>
      <div class="ts">USA · Canada · Mexico · Bracket Phase</div>
    </div>
  </div>
  <div id="cdblock" style="text-align:center">
    <div id="cd">--d --h --m --s</div>
    <div class="cdf">Final</div>
  </div>
  <div class="hr">
    <div id="clk">--:-- --</div>
    <div id="dt">--</div>
    <div id="upd">Loading…</div>
  </div>
</div>

<div id="viewport">
  <div id="content">
    <!-- TOP ROW: GROUPS + SCORERS -->
    <div id="top-row">
      <div id="groups-panel">
        <div class="groups-header">📊 GROUPS (click)</div>
        <div class="groups-list" id="groups-list"></div>
      </div>
      <div id="scorers-panel">
        <div class="scorers-header">⚽ TOP 8 SCORERS</div>
        <div class="scorers-grid" id="scorers-grid"></div>
      </div>
    </div>

    <!-- BRACKET -->
    <div id="bracket-section">
      <div class="bracket-wrapper">
        <div class="bracket-grid" id="bracket-grid"></div>
      </div>
    </div>

    <!-- TEAMS BY GROUP -->
    <div id="teams-bottom">
      <div class="teams-header">📍 ALL 48 TEAMS</div>
      <div class="teams-grid" id="teams-grid"></div>
    </div>
  </div>

  <div id="tickers">
    <div class="tlabel">🏆 News</div>
    <div class="twrap"><div class="ttrack" id="news-track"></div></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  WORLD CUP 2026 BRACKET PHASE — Fox/ESPN Style
// ═══════════════════════════════════════════════════════════════════

const CODE = {
  "Mexico":"MEX","South Africa":"RSA","Korea Republic":"KOR","South Korea":"KOR","Czechia":"CZE","Czech Republic":"CZE",
  "Canada":"CAN","Bosnia-Herzegovina":"BIH","Bosnia and Herzegovina":"BIH","Qatar":"QAT","Switzerland":"SUI",
  "Brazil":"BRA","Morocco":"MAR","Haiti":"HAI","Scotland":"SCO",
  "United States":"USA","USA":"USA","Paraguay":"PAR","Australia":"AUS","Turkey":"TUR","Türkiye":"TUR",
  "Germany":"GER","Curacao":"CUW","Curaçao":"CUW","Ivory Coast":"CIV","Côte d'Ivoire":"CIV","Ecuador":"ECU",
  "Netherlands":"NED","Japan":"JPN","Sweden":"SWE","Tunisia":"TUN",
  "Belgium":"BEL","Egypt":"EGY","Iran":"IRN","New Zealand":"NZL",
  "Spain":"ESP","Cape Verde":"CPV","Saudi Arabia":"KSA","Uruguay":"URU",
  "France":"FRA","Senegal":"SEN","Iraq":"IRQ","Norway":"NOR",
  "Argentina":"ARG","Algeria":"ALG","Austria":"AUT","Jordan":"JOR",
  "Portugal":"POR","DR Congo":"COD","Congo DR":"COD","Uzbekistan":"UZB","Colombia":"COL",
  "England":"ENG","Croatia":"CRO","Ghana":"GHA","Panama":"PAN"
};
const FLAG = {
  MEX:"🇲🇽",RSA:"🇿🇦",KOR:"🇰🇷",CZE:"🇨🇿",CAN:"🇨🇦",BIH:"🇧🇦",QAT:"🇶🇦",SUI:"🇨🇭",
  BRA:"🇧🇷",MAR:"🇲🇦",HAI:"🇭🇹",SCO:"🏴󠁧󠁢󠁳󠁣󠁴󠁿",USA:"🇺🇸",PAR:"🇵🇾",AUS:"🇦🇺",TUR:"🇹🇷",
  GER:"🇩🇪",CUW:"🇨🇼",CIV:"🇨🇮",ECU:"🇪🇨",NED:"🇳🇱",JPN:"🇯🇵",SWE:"🇸🇪",TUN:"🇹🇳",
  BEL:"🇧🇪",EGY:"🇪🇬",IRN:"🇮🇷",NZL:"🇳🇿",ESP:"🇪🇸",CPV:"🇨🇻",KSA:"🇸🇦",URU:"🇺🇾",
  FRA:"🇫🇷",SEN:"🇸🇳",IRQ:"🇮🇶",NOR:"🇳🇴",ARG:"🇦🇷",ALG:"🇩🇿",AUT:"🇦🇹",JOR:"🇯🇴",
  POR:"🇵🇹",COD:"🇨🇩",UZB:"🇺🇿",COL:"🇨🇴",ENG:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",CRO:"🇭🇷",GHA:"🇬🇭",PAN:"🇵🇦"
};
const GROUPS = {
  A:["MEX","RSA","KOR","CZE"],B:["CAN","BIH","QAT","SUI"],C:["BRA","MAR","HAI","SCO"],
  D:["USA","PAR","AUS","TUR"],E:["GER","CUW","CIV","ECU"],F:["NED","JPN","SWE","TUN"],
  G:["BEL","EGY","IRN","NZL"],H:["ESP","CPV","KSA","URU"],I:["FRA","SEN","IRQ","NOR"],
  J:["ARG","ALG","AUT","JOR"],K:["POR","COD","UZB","COL"],L:["ENG","CRO","GHA","PAN"]
};
const FULL_NAME={MEX:"Mexico",RSA:"South Africa",KOR:"South Korea",CZE:"Czechia",
  CAN:"Canada",BIH:"Bosnia",QAT:"Qatar",SUI:"Switzerland",BRA:"Brazil",MAR:"Morocco",
  HAI:"Haiti",SCO:"Scotland",USA:"USA",PAR:"Paraguay",AUS:"Australia",TUR:"Türkiye",
  GER:"Germany",CUW:"Curacao",CIV:"Ivory Coast",ECU:"Ecuador",NED:"Netherlands",
  JPN:"Japan",SWE:"Sweden",TUN:"Tunisia",BEL:"Belgium",EGY:"Egypt",IRN:"Iran",
  NZL:"New Zealand",ESP:"Spain",CPV:"Cape Verde",KSA:"Saudi Arabia",URU:"Uruguay",
  FRA:"France",SEN:"Senegal",IRQ:"Iraq",NOR:"Norway",ARG:"Argentina",ALG:"Algeria",
  AUT:"Austria",JOR:"Jordan",POR:"Portugal",COD:"DR Congo",UZB:"Uzbekistan",
  COL:"Colombia",ENG:"England",CRO:"Croatia",GHA:"Ghana",PAN:"Panama"
};

const ESPN_SCORE = d => `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${d}`;
const ESPN_NEWS  = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/news?limit=40';

function toLocal(utcStr){ return new Date(utcStr); }
function pad(n){return String(n).padStart(2,'0');}

async function fetchAllMatches(){
  const matches=[]; const scores={};
  const start=new Date(Date.UTC(2026,5,11));
  const end=new Date(Date.UTC(2026,6,19));
  const dates=[];
  for(let d=new Date(start); d<=end; d.setUTCDate(d.getUTCDate()+1)){
    const y=d.getUTCFullYear(), m=String(d.getUTCMonth()+1).padStart(2,'0'), day=String(d.getUTCDate()).padStart(2,'0');
    dates.push(`${y}${m}${day}`);
  }
  for(let i=0;i<dates.length;i+=8){
    const batch=dates.slice(i,i+8);
    const results=await Promise.allSettled(batch.map(ds=>
      fetch(ESPN_SCORE(ds),{cache:'no-store'}).then(r=>r.json())
    ));
    for(const res of results){
      if(res.status!=='fulfilled') continue;
      for(const e of (res.value.events||[])){
        const stName=e.status?.type?.name||'';
        const stState=e.status?.type?.state||'';
        const stClock=e.status?.displayClock||'';
        let status='upcoming';
        if(stName.includes('HALFTIME')||stName.includes('HALF_TIME')) status='HT';
        else if(stName.includes('FULL_TIME')||stName.includes('FINAL')||stState==='post') status='FT';
        else if(stState==='in'||stName.includes('IN_PROGRESS')||stName.includes('FIRST_HALF')) status='LIVE '+stClock;
        
        for(const comp of (e.competitions||[])){
          const teams=comp.competitors||[]; if(teams.length<2)continue;
          const home=teams.find(t=>t.homeAway==='home')||teams[0];
          const away=teams.find(t=>t.homeAway==='away')||teams[1];
          const c1=CODE[home.team?.displayName]||(home.team?.displayName||'').slice(0,3).toUpperCase();
          const c2=CODE[away.team?.displayName]||(away.team?.displayName||'').slice(0,3).toUpperCase();
          const s1=home.score!=null?parseInt(home.score):null;
          const s2=away.score!=null?parseInt(away.score):null;
          const ptd=e.date?toLocal(e.date):null;
          const city=comp.venue?.address?.city||'';
          let group='';
          for(const g in GROUPS){if(GROUPS[g].includes(c1)&&GROUPS[g].includes(c2)){group=g;break;}}
          const events=[];
          for(const d of (comp.details||[])){
            if(d.scoringPlay||d.type?.text?.includes('Goal')){
              const nm=d.athletesInvolved?.[0]?.displayName||'';
              const aid=d.athletesInvolved?.[0]?.id||'';
              events.push({kind:'goal',nm,aid});
            }
          }
          matches.push({c1,c2,ptd,venue:city,group,s1,s2,status,events});
          scores[c1+'_'+c2]=[s1,s2,status];
        }
      }
    }
  }
  return {matches,scores};
}

function calcStandings(g,matches){
  const codes=GROUPS[g];
  const st={}; codes.forEach(c=>st[c]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  for(const m of matches){
    if(m.group!==g||m.status==='upcoming'||m.s1==null||m.s2==null)continue;
    const {c1,c2,s1,s2}=m; if(!st[c1]||!st[c2])continue;
    st[c1].p++;st[c2].p++;st[c1].gf+=s1;st[c1].ga+=s2;st[c2].gf+=s2;st[c2].ga+=s1;
    if(s1>s2){st[c1].w++;st[c1].pts+=3;st[c2].l++;}
    else if(s2>s1){st[c2].w++;st[c2].pts+=3;st[c1].l++;}
    else{st[c1].d++;st[c1].pts++;st[c2].d++;st[c2].pts++;}
  }
  const ranked=[...codes].sort((a,b)=>st[b].pts-st[a].pts||(st[b].gf-st[b].ga)-(st[a].gf-st[a].ga)||st[b].gf-st[a].gf);
  return ranked.map(c=>[FLAG[c]||'',c,st[c]]);
}

function renderGroups(){
  let html='';
  for(const g in GROUPS){
    const isTur=GROUPS[g].includes('TUR');
    html+=`<button class="group-btn${isTur?' tur':''}" onclick="openGroupOverlay('${g}')">${g}</button>`;
  }
  document.getElementById('groups-list').innerHTML=html;
}

const CLUB_CACHE={};
let LAST_SCORERS=[];

function computeScorers(matches){
  const tally={};
  for(const m of matches){
    if(!m.events||!m.events.length) continue;
    for(const ev of m.events){
      if(ev.kind!=='goal') continue;
      const nm=ev.nm; if(!nm) continue;
      const team=m.c1; // simplified
      if(!tally[nm]) tally[nm]={goals:0,team};
      tally[nm].goals++;
    }
  }
  const arr=Object.entries(tally).map(([name,v])=>({name,goals:v.goals,team:v.team}));
  arr.sort((a,b)=>b.goals-a.goals);
  return arr.slice(0,8);
}

function renderScorers(scorers){
  let html='';
  if(!scorers.length){
    html='<div style="grid-column:1/-1;color:var(--muted);font-size:10px;padding:8px;text-align:center">Scorers update…</div>';
  } else {
    scorers.forEach((s,i)=>{
      html+=`<div class="scorer-card">
        <div><span class="sc-rank">#${i+1}</span> <span class="sc-name">${s.name}</span></div>
        <div class="sc-team">${FLAG[s.team]||''} ${s.team}</div>
        <div class="sc-goals">${s.goals}⚽</div>
      </div>`;
    });
  }
  document.getElementById('scorers-grid').innerHTML=html;
}

function renderBracket(matches,scores){
  const seeds={};
  for(const g in GROUPS){
    const ranked=calcStandings(g,matches);
    for(let i=0;i<2;i++){
      const code=ranked[i][1];
      seeds[`${i+1}${g}`]=code;
    }
  }
  
  const r32=[
    ['1A','2B'],['1C','2D'],['1E','2F'],['1G','2H'],['1I','2J'],['1K','2L'],
    ['2A','1B'],['2C','1D'],['2E','1F'],['2G','1H'],['2I','1J'],['2K','1L']
  ];
  
  let html=`<div style="display:flex;gap:12px;align-items:center;font-family:'Oswald';color:var(--gold);font-size:8px;text-transform:uppercase">
    <div style="text-align:center;min-width:60px"><div style="margin-bottom:4px">R32</div>
    <div style="display:flex;flex-direction:column;gap:6px">`;
  
  for(let i=0;i<r32.length;i++){
    const [s1,s2]=r32[i];
    const c1=seeds[s1], c2=seeds[s2];
    if(!c1||!c2) continue;
    const sc=scores[c1+'_'+c2]||[null,null,'upcoming'];
    const isTur=c1==='TUR'||c2==='TUR';
    const isLive=sc[2]&&(sc[2].includes('LIVE')||sc[2]==='HT');
    const isFT=sc[2]==='FT';
    let cls=`bracket-seed${isTur?' tur':''}${isLive?' live':''}${isFT?' ft':''}`;
    html+=`<div class="${cls}" onclick="openMatchOverlay('${c1}','${c2}')">
      <span class="seed">${s1}v${s2}</span>
      <span class="score">${sc[0]!=null?sc[0]+'-'+sc[1]:''}</span>
    </div>`;
  }
  html+=`</div></div><div style="width:1px;background:var(--gold)"></div>`;
  html+=`<div style="text-align:center;font-family:'Oswald';color:var(--gold);font-size:8px">
    <div>R16</div><div class="bracket-seed">R16</div>
    <div style="margin-top:20px">QF</div><div class="bracket-seed">QF</div>
    <div style="margin-top:20px">SF</div><div class="bracket-seed">SF</div>
    <div style="margin-top:30px" class="bracket-final">🏆 FINAL</div>
  </div>`;
  html+=`</div>`;
  
  document.getElementById('bracket-grid').innerHTML=html;
}

function renderTeamsBottom(){
  let html='';
  for(const g in GROUPS){
    html+=`<div class="group-teams">`;
    for(const code of GROUPS[g]){
      html+=`<div class="team-pill${code==='TUR'?' tur':''}" onclick="openTeamOverlay('${code}')">
        <span class="flag">${FLAG[code]||''}</span>${code}
      </div>`;
    }
    html+=`</div>`;
  }
  document.getElementById('teams-grid').innerHTML=html;
}

async function fetchNews(){
  let wc=[];
  try{
    const r=await fetch(ESPN_NEWS,{cache:'no-store'});
    const data=await r.json();
    for(const a of (data.articles||[])){
      wc.push(a.headline||'');
    }
  }catch(e){}
  if(!wc.length)wc=["France advance to semifinals","Türkiye surprise package in R16","England battle back","Brazil's campaign continues","Argentina dominate knockout"];
  wc.push("Design by Tuncer");
  return wc.slice(0,10);
}

function renderNews(news){
  const s=news.map(h=>`<span class="ti">${h}</span>`).join('');
  document.getElementById('news-track').innerHTML=s+s;
}

const FINAL=new Date('2026-07-19T19:00:00Z');
function tick(){
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  const ap=h>=12?'PM':'AM',hh=h%12||12;
  document.getElementById('clk').textContent=pad(hh)+':'+pad(m)+':'+pad(s)+' '+ap;
  const mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dt').textContent=mos[now.getMonth()]+' '+now.getDate();
  let diff=FINAL-now;
  if(diff<=0){document.getElementById('cd').textContent='🏆 FINAL!';return;}
  const d=Math.floor(diff/86400000);diff%=86400000;
  const h2=Math.floor(diff/3600000);diff%=3600000;
  const m2=Math.floor(diff/60000);diff%=60000;
  const s2=Math.floor(diff/1000);
  document.getElementById('cd').textContent=d+'d '+pad(h2)+'h '+pad(m2)+'m '+pad(s2)+'s';
}

let CUR_OVERLAY=null;
function openOverlay(html,key){
  document.getElementById('overlay-content').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
  CUR_OVERLAY=key||null;
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('open');
  CUR_OVERLAY=null;
}

function openGroupOverlay(g){
  if(CUR_OVERLAY==='group:'+g){ closeOverlay(); return; }
  const ranked=calcStandings(g,LATEST_MATCHES);
  let std='<table class="ovs-table"><thead><tr><th class="l">#</th><th class="l">Team</th><th>Pts</th><th>GD</th></tr></thead><tbody>';
  ranked.forEach(([flag,code,s],pos)=>{
    const gd=s.gf-s.ga;
    std+=`<tr><td>${pos+1}</td><td class="l"><span class="ovs-flag">${flag}</span> <span class="ovs-name">${FULL_NAME[code]}</span></td><td class="ovs-pts">${s.pts}</td><td>${gd>0?'+':''}${gd}</td></tr>`;
  });
  std+='</tbody></table>';
  openOverlay(`<div class="ov-title">📊 GROUP ${g}</div>${std}`,'group:'+g);
}

function openTeamOverlay(code){
  openOverlay(`<div class="ov-title">${FLAG[code]} ${FULL_NAME[code]}</div>`,'team:'+code);
}

function openMatchOverlay(c1,c2){
  const sc=LATEST_SCORES[c1+'_'+c2]||[null,null,'upcoming'];
  const scoreText=sc[0]!=null?`${sc[0]}–${sc[1]}`:'vs';
  openOverlay(`<div class="ov-title">${FLAG[c1]} ${c1} v ${c2} ${FLAG[c2]}</div>
    <div style="font-size:20px;text-align:center;margin:20px 0;font-weight:700;color:var(--gold)">${scoreText}</div>`,'match:'+c1+c2);
}

let AUDIO_ON=false;
let audioCtx=null;
function ensureCtx(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function chime(){
  if(!AUDIO_ON)return;
  const ctx=ensureCtx();
  [880,1175,1480].forEach((f,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,ctx.currentTime+i*0.12);
    g.gain.linearRampToValueAtTime(0.15,ctx.currentTime+i*0.14);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.4);
    o.connect(g);g.connect(ctx.destination);
    o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.4);
  });
}
function enableAudio(){
  AUDIO_ON=true;
  ensureCtx();
  document.getElementById('audio-enable').style.display='none';
  document.getElementById('audio-toggle').style.display='flex';
  chime();
}
function toggleMute(){
  AUDIO_ON=!AUDIO_ON;
  document.getElementById('audio-toggle').textContent=AUDIO_ON?'🔊':'🔇';
}

let LATEST_MATCHES=[],LATEST_SCORES={};
async function refresh(){
  const eb=document.getElementById('err-banner');
  try{
    const {matches,scores}=await fetchAllMatches();
    if(!matches.length)throw new Error('no data');
    LATEST_MATCHES=matches;LATEST_SCORES=scores;
    const news=await fetchNews();
    const scorers=computeScorers(matches);
    if(scorers.length)LAST_SCORERS=scorers;
    
    renderGroups();renderScorers(LAST_SCORERS);renderBracket(matches,scores);renderTeamsBottom();renderNews(news);
    
    const now=new Date();
    document.getElementById('upd').textContent='Updated: '+now.toLocaleTimeString();
    document.getElementById('loading').style.display='none';
    eb.style.display='none';
    return 600000;
  }catch(e){
    console.error('fetch failed',e);
    eb.style.display='block';
    eb.textContent='⚠ Data fetch failed';
    document.getElementById('loading').style.display='none';
    return 60000;
  }
}

async function loop(){
  const wait=await refresh();
  setTimeout(loop,wait);
}

setInterval(tick,1000);tick();
loop();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();});
</script>
