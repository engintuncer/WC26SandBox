<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#ffffff">
<title>World Cup 2026 Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#FFD700;--gold2:#FFA500;--green:#00c97a;--blue:#1e3a8a;
  --live:#ff4444;--bg:#f0f4f8;--bg2:#ffffff;--bg3:#e8eef7;
  --border:#d4dce8;--text:#1a2438;--muted:#64748b;
  --tur:#c0392b;--tur-bg:rgba(192,57,43,.1)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Roboto Condensed',sans-serif;overflow:hidden}

#hdr{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#ffffff 0%,#f8fafc 100%);
  border-bottom:2px solid var(--blue);padding:10px 16px;height:56px;gap:12px;flex-shrink:0}
.hl{display:flex;align-items:center;gap:10px;flex-shrink:0}
.trophy{font-size:22px}
.tm{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--blue);letter-spacing:1px}
.ts{font-size:8px;color:var(--muted);letter-spacing:1px}
#cdblock{text-align:center;flex-shrink:0;font-family:'Oswald',sans-serif}
#cd{font-size:16px;font-weight:700;color:var(--gold)}
.hr{text-align:right;flex-shrink:0;font-size:12px}
#clk{font-family:'Oswald',sans-serif;color:var(--text);font-weight:600}

#viewport{display:flex;flex-direction:column;height:calc(100vh - 56px - 48px);overflow:hidden}

#top-section{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px;flex-shrink:0;height:auto}

.panel{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px;overflow:hidden}
.panel-title{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;color:var(--blue);
  margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--blue);padding-bottom:4px}

/* TOP 8 TEAMS TABLE */
#teams-table{width:100%;border-collapse:collapse;font-size:10px}
#teams-table th{background:var(--bg3);color:var(--blue);text-align:center;padding:4px;font-weight:700;border:none}
#teams-table th.l{text-align:left}
#teams-table td{padding:4px;text-align:center;border-bottom:1px solid var(--border)}
#teams-table td.l{text-align:left;cursor:pointer;transition:all .2s}
#teams-table tr:hover td{background:var(--bg3)}
.t-rank{font-weight:700;color:var(--blue);width:20px}
.t-flag{font-size:12px;width:20px}
.t-code{font-weight:600;width:35px}
.t-pts{font-weight:700;color:var(--gold);width:25px}

/* TODAY'S MATCHES */
#today-section{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px;overflow-y:auto;max-height:100px;flex-shrink:0}
.today-title{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;color:var(--blue);
  margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid var(--gold);padding-bottom:3px}
.today-matches{display:flex;flex-direction:column;gap:4px}
.today-match{background:var(--bg3);padding:6px;border-radius:3px;cursor:pointer;transition:all .2s;border-left:3px solid var(--border)}
.today-match:hover{border-color:var(--blue);box-shadow:0 2px 6px rgba(30,58,138,.1)}
.today-match.live{border-color:var(--live);background:rgba(255,68,68,.05)}
.tm-teams{font-size:9px;font-weight:600;color:var(--text)}
.tm-score{font-size:11px;font-weight:700;color:var(--gold);margin:2px 0}
.tm-meta{font-size:7px;color:var(--muted)}

/* TOP 8 SCORERS */
.scorers-list{display:flex;flex-direction:column;gap:3px}
.scorer-row{display:flex;align-items:flex-start;gap:6px;padding:5px;border-radius:3px;
  cursor:pointer;transition:all .2s;font-size:9px;border:1px solid transparent}
.scorer-row:hover{background:var(--bg3);border-color:var(--blue)}
.sc-rank{font-family:'Oswald',sans-serif;font-weight:700;color:var(--gold);min-width:16px;flex-shrink:0}
.sc-info{flex:1;min-width:0}
.sc-name{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-team{font-size:8px;color:var(--muted)}
.sc-club{font-size:7px;color:var(--gold2);font-style:italic}
.sc-goals{font-family:'Oswald',sans-serif;font-weight:700;color:var(--green);min-width:20px;text-align:right;flex-shrink:0}

/* BRACKET */
#bracket-container{flex:1;display:flex;flex-direction:column;overflow:auto;padding:8px}
.bracket-row{display:flex;justify-content:space-around;align-items:center;gap:8px;margin-bottom:12px;min-height:90px}
.bracket-col{display:flex;flex-direction:column;gap:6px;min-width:100px}
.match-box{background:var(--bg2);border:2px solid var(--border);border-radius:5px;padding:8px;
  cursor:pointer;transition:all .2s;text-align:center;min-height:70px;display:flex;flex-direction:column;justify-content:center}
.match-box:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(30,58,138,.15)}
.match-box.live{border-color:var(--live);box-shadow:0 0 12px rgba(255,68,68,.4)}
.match-box.ft{border-color:var(--green)}
.match-box.tur{border-left:3px solid var(--tur)}
.match-teams{font-weight:700;color:var(--blue);font-size:10px;margin-bottom:3px}
.match-score{color:var(--gold);font-weight:700;font-size:11px;margin-bottom:3px}
.match-meta{font-size:7px;color:var(--muted);line-height:1.3}

.bracket-label{font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;color:var(--blue);text-align:center;margin-bottom:4px}

/* TICKER */
#tickers{height:48px;background:linear-gradient(135deg,#e8eef7 0%,#d4dce8 100%);
  border-top:2px solid var(--border);display:flex;align-items:center;overflow:hidden;flex-shrink:0}
.tlabel{flex-shrink:0;width:100px;font-family:'Oswald',sans-serif;font-size:11px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:0 10px;
  border-right:2px solid var(--border);color:var(--blue)}
.twrap{flex:1;overflow:hidden;display:flex;align-items:center}
.ttrack{display:flex;align-items:center;white-space:nowrap;animation:sl 60s linear infinite}
.ti{font-size:13px;padding:0 20px;color:var(--text);font-weight:500}
@keyframes sl{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* OVERLAY */
#overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(26,36,56,.85);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:20px}
#overlay.open{display:flex}
#overlay-card{background:var(--bg2);border:2px solid var(--blue);border-radius:12px;
  width:min(900px,90vw);max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.2);
  padding:24px;position:relative}
#overlay-close{position:absolute;top:12px;right:14px;width:32px;height:32px;background:var(--bg3);
  color:var(--blue);border:1px solid var(--border);border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
#overlay-close:hover{background:var(--border)}
.ov-title{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:var(--blue);letter-spacing:1px;margin-bottom:16px}
.ov-section{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;color:var(--gold);
  text-transform:uppercase;margin:16px 0 10px;border-bottom:2px solid var(--border);padding-bottom:6px}
.match-history{display:grid;gap:8px}
.history-item{background:var(--bg3);padding:8px;border-radius:4px;border-left:3px solid var(--blue)}
.history-item.ft{border-color:var(--green)}
.hi-teams{font-weight:700;color:var(--text);font-size:12px;margin-bottom:4px}
.hi-score{font-size:14px;color:var(--gold);font-weight:700;margin-bottom:4px}
.hi-meta{font-size:10px;color:var(--muted)}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;gap:14px}
#loading .trophy-big{font-size:60px;animation:bounce 1.5s infinite}
#loading .lt{font-family:'Oswald',sans-serif;font-size:22px;color:var(--blue);letter-spacing:2px}
#loading .ls{font-size:13px;color:var(--muted)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

#err-banner{display:none;position:fixed;top:0;left:0;right:0;background:#fee2e2;
  color:#991b1b;font-size:12px;padding:6px 14px;z-index:90;text-align:center;font-weight:700}

#audio-enable{position:fixed;bottom:70px;right:16px;z-index:95;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;
  border:none;border-radius:24px;padding:10px 18px;font-family:'Oswald',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#audio-toggle{display:none;position:fixed;bottom:70px;right:16px;z-index:95;
  width:38px;height:38px;align-items:center;justify-content:center;
  background:var(--bg3);color:var(--blue);border:1px solid var(--border);
  border-radius:50%;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.1)}

@media (max-aspect-ratio:1/1){
  #top-section{grid-template-columns:1fr}
  #today-section{max-height:none}
}
</style>
</head>
<body>

<div id="loading">
  <div class="trophy-big">🏆</div>
  <div class="lt">FIFA WORLD CUP 2026</div>
  <div class="ls">Loading bracket…</div>
</div>

<div id="err-banner"></div>

<button id="audio-enable" onclick="enableAudio()">🔊 Alerts</button>
<button id="audio-toggle" onclick="toggleMute()" title="Mute">🔊</button>

<div id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div id="overlay-card">
    <button id="overlay-close" onclick="closeOverlay()">✕</button>
    <div id="overlay-content"></div>
  </div>
</div>

<div id="hdr">
  <div class="hl">
    <span class="trophy">🏆</span>
    <div>
      <div class="tm">FIFA WORLD CUP 2026</div>
      <div class="ts">BRACKET PHASE</div>
    </div>
  </div>
  <div id="cdblock">
    <div id="cd">--d --h --m --s</div>
  </div>
  <div class="hr">
    <div id="clk">--:-- --</div>
    <div id="dt" style="font-size:8px;color:var(--muted)">--</div>
    <div id="upd" style="font-size:7px;color:var(--muted)">Loading…</div>
  </div>
</div>

<div id="viewport">
  <div id="top-section">
    <div class="panel">
      <div class="panel-title">🥇 TOP 8 TEAMS</div>
      <table id="teams-table">
        <thead>
          <tr><th class="l">Rank</th><th>Flag</th><th>Code</th><th>Pts</th></tr>
        </thead>
        <tbody id="teams-body"></tbody>
      </table>
    </div>

    <div id="today-section">
      <div class="today-title">📅 TODAY'S MATCHES</div>
      <div class="today-matches" id="today-matches"></div>
    </div>

    <div class="panel">
      <div class="panel-title">⚽ TOP 8 SCORERS</div>
      <div class="scorers-list" id="scorers-list"></div>
    </div>
  </div>

  <div id="bracket-container"></div>
</div>

<div id="tickers">
  <div class="tlabel">📰 News</div>
  <div class="twrap"><div class="ttrack" id="news-track"></div></div>
</div>

<script>
const CODE = {
  "Mexico":"MEX","South Africa":"RSA","Korea Republic":"KOR","South Korea":"KOR","Czechia":"CZE","Czech Republic":"CZE",
  "Canada":"CAN","Bosnia-Herzegovina":"BIH","Bosnia and Herzegovina":"BIH","Qatar":"QAT","Switzerland":"SUI",
  "Brazil":"BRA","Morocco":"MAR","Haiti":"HAI","Scotland":"SCO","United States":"USA","USA":"USA","Paraguay":"PAR",
  "Australia":"AUS","Turkey":"TUR","Türkiye":"TUR","Germany":"GER","Curacao":"CUW","Curaçao":"CUW","Ivory Coast":"CIV",
  "Côte d'Ivoire":"CIV","Ecuador":"ECU","Netherlands":"NED","Japan":"JPN","Sweden":"SWE","Tunisia":"TUN","Belgium":"BEL",
  "Egypt":"EGY","Iran":"IRN","New Zealand":"NZL","Spain":"ESP","Cape Verde":"CPV","Saudi Arabia":"KSA","Uruguay":"URU",
  "France":"FRA","Senegal":"SEN","Iraq":"IRQ","Norway":"NOR","Argentina":"ARG","Algeria":"ALG","Austria":"AUT","Jordan":"JOR",
  "Portugal":"POR","DR Congo":"COD","Congo DR":"COD","Uzbekistan":"UZB","Colombia":"COL","England":"ENG","Croatia":"CRO",
  "Ghana":"GHA","Panama":"PAN"
};
const FLAG = {
  MEX:"🇲🇽",RSA:"🇿🇦",KOR:"🇰🇷",CZE:"🇨🇿",CAN:"🇨🇦",BIH:"🇧🇦",QAT:"🇶🇦",SUI:"🇨🇭",BRA:"🇧🇷",MAR:"🇲🇦",HAI:"🇭🇹",SCO:"🏴󠁧󠁢󠁳󠁣󠁴󠁿",
  USA:"🇺🇸",PAR:"🇵🇾",AUS:"🇦🇺",TUR:"🇹🇷",GER:"🇩🇪",CUW:"🇨🇼",CIV:"🇨🇮",ECU:"🇪🇨",NED:"🇳🇱",JPN:"🇯🇵",SWE:"🇸🇪",TUN:"🇹🇳",
  BEL:"🇧🇪",EGY:"🇪🇬",IRN:"🇮🇷",NZL:"🇳🇿",ESP:"🇪🇸",CPV:"🇨🇻",KSA:"🇸🇦",URU:"🇺🇾",FRA:"🇫🇷",SEN:"🇸🇳",IRQ:"🇮🇶",NOR:"🇳🇴",
  ARG:"🇦🇷",ALG:"🇩🇿",AUT:"🇦🇹",JOR:"🇯🇴",POR:"🇵🇹",COD:"🇨🇩",UZB:"🇺🇿",COL:"🇨🇴",ENG:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",CRO:"🇭🇷",GHA:"🇬🇭",PAN:"🇵🇦"
};
const GROUPS = {A:["MEX","RSA","KOR","CZE"],B:["CAN","BIH","QAT","SUI"],C:["BRA","MAR","HAI","SCO"],
  D:["USA","PAR","AUS","TUR"],E:["GER","CUW","CIV","ECU"],F:["NED","JPN","SWE","TUN"],
  G:["BEL","EGY","IRN","NZL"],H:["ESP","CPV","KSA","URU"],I:["FRA","SEN","IRQ","NOR"],
  J:["ARG","ALG","AUT","JOR"],K:["POR","COD","UZB","COL"],L:["ENG","CRO","GHA","PAN"]};
const FULL_NAME={MEX:"Mexico",RSA:"South Africa",KOR:"South Korea",CZE:"Czechia",CAN:"Canada",BIH:"Bosnia",QAT:"Qatar",SUI:"Switzerland",
  BRA:"Brazil",MAR:"Morocco",HAI:"Haiti",SCO:"Scotland",USA:"USA",PAR:"Paraguay",AUS:"Australia",TUR:"Türkiye",GER:"Germany",CUW:"Curacao",
  CIV:"Ivory Coast",ECU:"Ecuador",NED:"Netherlands",JPN:"Japan",SWE:"Sweden",TUN:"Tunisia",BEL:"Belgium",EGY:"Egypt",IRN:"Iran",NZL:"New Zealand",
  ESP:"Spain",CPV:"Cape Verde",KSA:"Saudi Arabia",URU:"Uruguay",FRA:"France",SEN:"Senegal",IRQ:"Iraq",NOR:"Norway",ARG:"Argentina",ALG:"Algeria",
  AUT:"Austria",JOR:"Jordan",POR:"Portugal",COD:"DR Congo",UZB:"Uzbekistan",COL:"Colombia",ENG:"England",CRO:"Croatia",GHA:"Ghana",PAN:"Panama"};

const BRACKET_SCHEDULE = {
  R32: [
    {date:'2026-06-28',stadium:'Los Angeles',teams:['1A','2B']},
    {date:'2026-06-29',stadium:'Boston',teams:['GER','3*']},{date:'2026-06-29',stadium:'Monterrey',teams:['1F','2C']},{date:'2026-06-29',stadium:'Houston',teams:['1C','2F']},
    {date:'2026-06-30',stadium:'New York',teams:['1I','3*']},{date:'2026-06-30',stadium:'Dallas',teams:['2E','2I']},{date:'2026-06-30',stadium:'Mexico City',teams:['MEX','3*']},
    {date:'2026-07-01',stadium:'Atlanta',teams:['1L','3*']},{date:'2026-07-01',stadium:'San Francisco',teams:['USA','3*']},{date:'2026-07-01',stadium:'Seattle',teams:['1G','3*']},
    {date:'2026-07-02',stadium:'Toronto',teams:['2K','2L']},{date:'2026-07-02',stadium:'Los Angeles',teams:['1H','2J']},{date:'2026-07-02',stadium:'Vancouver',teams:['1B','3*']},
    {date:'2026-07-03',stadium:'Miami',teams:['ARG','2H']},{date:'2026-07-03',stadium:'Kansas City',teams:['1K','3*']},{date:'2026-07-03',stadium:'Dallas',teams:['2D','2G']}
  ],
  R16: [
    {date:'2026-07-04',stadium:'Philadelphia'},{date:'2026-07-04',stadium:'Houston'},
    {date:'2026-07-05',stadium:'New York'},{date:'2026-07-05',stadium:'Mexico City'},
    {date:'2026-07-06',stadium:'Dallas'},{date:'2026-07-06',stadium:'Seattle'},
    {date:'2026-07-07',stadium:'Atlanta'},{date:'2026-07-07',stadium:'Vancouver'}
  ],
  QF: [
    {date:'2026-07-09',stadium:'Boston'},{date:'2026-07-10',stadium:'Los Angeles'},
    {date:'2026-07-11',stadium:'Miami'},{date:'2026-07-11',stadium:'Kansas City'}
  ],
  SF: [
    {date:'2026-07-14',stadium:'Dallas'},{date:'2026-07-15',stadium:'Atlanta'}
  ],
  Final: [
    {date:'2026-07-19',stadium:'New York'}
  ]
};

const ESPN_SCORE = d => `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${d}`;
const ESPN_NEWS = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/news?limit=40';

function toLocal(utcStr){return new Date(utcStr);}
function pad(n){return String(n).padStart(2,'0');}
function fmtTime(d){const h=d.getHours(),m=d.getMinutes(),ap=h>=12?'pm':'am',h12=h%12||12;return `${h12}:${pad(m)}${ap}`;}
function fmtVenue(str){if(!str)return'';return str.length>12?str.slice(0,12):str;}

async function fetchAllMatches(){
  const matches=[]; const scores={};
  const start=new Date(Date.UTC(2026,5,11));
  const end=new Date(Date.UTC(2026,6,19));
  const dates=[];
  for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1)){
    const y=d.getUTCFullYear(),m=String(d.getUTCMonth()+1).padStart(2,'0'),day=String(d.getUTCDate()).padStart(2,'0');
    dates.push(`${y}${m}${day}`);
  }
  for(let i=0;i<dates.length;i+=8){
    const batch=dates.slice(i,i+8);
    const results=await Promise.allSettled(batch.map(ds=>fetch(ESPN_SCORE(ds),{cache:'no-store'}).then(r=>r.json())));
    for(const res of results){
      if(res.status!=='fulfilled')continue;
      for(const e of (res.value.events||[])){
        const stName=e.status?.type?.name||'';const stState=e.status?.type?.state||'';const stClock=e.status?.displayClock||'';
        let status='upcoming';
        if(stName.includes('HALFTIME'))status='HT';
        else if(stName.includes('FULL_TIME')||stName.includes('FINAL')||stState==='post')status='FT';
        else if(stState==='in'||stName.includes('IN_PROGRESS')||stName.includes('FIRST_HALF'))status='LIVE '+stClock;
        
        for(const comp of (e.competitions||[])){
          const teams=comp.competitors||[]; if(teams.length<2)continue;
          const home=teams.find(t=>t.homeAway==='home')||teams[0];
          const away=teams.find(t=>t.homeAway==='away')||teams[1];
          const c1=CODE[home.team?.displayName]||(home.team?.displayName||'').slice(0,3).toUpperCase();
          const c2=CODE[away.team?.displayName]||(away.team?.displayName||'').slice(0,3).toUpperCase();
          const s1=home.score!=null?parseInt(home.score):null;
          const s2=away.score!=null?parseInt(away.score):null;
          const ptd=e.date?toLocal(e.date):null;
          const venue=comp.venue?.address?.city||'';
          const stadium=comp.venue?.fullName||'';
          let group='';
          for(const g in GROUPS){if(GROUPS[g].includes(c1)&&GROUPS[g].includes(c2)){group=g;break;}}
          const events=[];
          for(const d of (comp.details||[])){
            if(d.scoringPlay){const nm=d.athletesInvolved?.[0]?.displayName||'';const clk=d.clock?.displayValue||'';
              events.push({type:'goal',name:nm,time:clk,pen:!!d.penaltyKick,og:!!d.ownGoal});}
            if(d.yellowCard){const nm=d.athletesInvolved?.[0]?.displayName||'';const clk=d.clock?.displayValue||'';
              events.push({type:'yellow',name:nm,time:clk});}
            if(d.redCard){const nm=d.athletesInvolved?.[0]?.displayName||'';const clk=d.clock?.displayValue||'';
              events.push({type:'red',name:nm,time:clk});}
          }
          matches.push({c1,c2,ptd,venue,stadium,group,s1,s2,status,events});
          scores[c1+'_'+c2]=[s1,s2,status];
        }
      }
    }
  }
  return {matches,scores};
}

function calcStandings(g,matches){
  const codes=GROUPS[g];
  const st={}; codes.forEach(c=>st[c]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,history:[]});
  for(const m of matches){
    if(m.group!==g||m.status==='upcoming'||m.s1==null||m.s2==null)continue;
    const {c1,c2,s1,s2}=m; if(!st[c1]||!st[c2])continue;
    st[c1].p++;st[c2].p++;st[c1].gf+=s1;st[c1].ga+=s2;st[c2].gf+=s2;st[c2].ga+=s1;
    st[c1].history.push({opp:c2,s1,s2,date:m.ptd,events:m.events});
    st[c2].history.push({opp:c1,s1:s2,s2:s1,date:m.ptd,events:m.events});
    if(s1>s2){st[c1].w++;st[c1].pts+=3;st[c2].l++;}
    else if(s2>s1){st[c2].w++;st[c2].pts+=3;st[c1].l++;}
    else{st[c1].d++;st[c1].pts++;st[c2].d++;st[c2].pts++;}
  }
  const ranked=[...codes].sort((a,b)=>st[b].pts-st[a].pts||(st[b].gf-st[b].ga)-(st[a].gf-st[a].ga)||st[b].gf-st[a].gf);
  return {ranked:ranked.map(c=>[FLAG[c]||'',c,st[c]]),standings:st};
}

function renderTeamsPanel(){
  const topTeams=[];
  for(const g in GROUPS){
    const {standings}=calcStandings(g,LATEST_MATCHES);
    for(const c of GROUPS[g]){
      if(standings[c]) topTeams.push({code:c,pts:standings[c].pts,gd:standings[c].gf-standings[c].ga,history:standings[c].history});
    }
  }
  topTeams.sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
  
  let html='';
  for(let i=0;i<8&&i<topTeams.length;i++){
    const t=topTeams[i];
    html+=`<tr onclick="openTeamOverlay('${t.code}')"><td class="t-rank">${i+1}</td><td class="t-flag">${FLAG[t.code]||''}</td><td class="t-code">${t.code}</td><td class="t-pts">${t.pts}</td></tr>`;
  }
  document.getElementById('teams-body').innerHTML=html;
}

function renderTodayMatches(){
  const now=new Date();
  const todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const todayMatches=LATEST_MATCHES.filter(m=>m.ptd&&m.ptd.toISOString().slice(0,10)===todayStr);
  
  let html='';
  if(!todayMatches.length){
    html='<div style="color:var(--muted);font-size:9px;padding:6px;text-align:center">No matches today</div>';
  } else {
    for(const m of todayMatches.sort((a,b)=>(a.ptd||0)-(b.ptd||0))){
      const sc=LATEST_SCORES[m.c1+'_'+m.c2]||[null,null,'upcoming'];
      const isLive=sc[2]&&(sc[2].includes('LIVE')||sc[2]==='HT');
      const isTur=m.c1==='TUR'||m.c2==='TUR';
      html+=`<div class="today-match${isLive?' live':''}${isTur?' tur':''}" onclick="openMatchOverlay('${m.c1}','${m.c2}')">
        <div class="tm-teams">${m.c1} vs ${m.c2}</div>
        ${sc[0]!=null?`<div class="tm-score">${sc[0]}-${sc[1]}</div>`:''}
        <div class="tm-meta">${m.ptd?fmtTime(m.ptd):''} · ${fmtVenue(m.venue)}</div>
      </div>`;
    }
  }
  document.getElementById('today-matches').innerHTML=html;
}

const CLUB_CACHE={};
let LAST_SCORERS=[];
function computeScorers(matches){
  const tally={};
  for(const m of matches){
    if(!m.events||!m.events.length)continue;
    for(const ev of m.events){
      if(ev.type!=='goal')continue;
      const nm=ev.name; if(!nm)continue;
      const team=m.c1;
      if(!tally[nm]) tally[nm]={goals:0,team,matches:[]};
      tally[nm].goals++;
      tally[nm].matches.push({opp:m.c2,date:m.ptd});
    }
  }
  const arr=Object.entries(tally).map(([name,v])=>({name,goals:v.goals,team:v.team,matches:v.matches}));
  arr.sort((a,b)=>b.goals-a.goals);
  return arr.slice(0,8);
}

function renderScorersPanel(){
  LAST_SCORERS=computeScorers(LATEST_MATCHES);
  let html='';
  for(let i=0;i<LAST_SCORERS.length;i++){
    const s=LAST_SCORERS[i];
    const club=CLUB_CACHE[s.name]||'--';
    html+=`<div class="scorer-row" onclick="openScorerOverlay('${s.name}','${s.team}')">
      <span class="sc-rank">${i+1}</span>
      <span class="sc-info">
        <div class="sc-name">${s.name}</div>
        <div class="sc-team">${FLAG[s.team]||''} ${s.team}</div>
        <div class="sc-club">${club}</div>
      </span>
      <span class="sc-goals">${s.goals}⚽</span>
    </div>`;
  }
  document.getElementById('scorers-list').innerHTML=html;
}

function renderBracket(){
  const seeds={};
  for(const g in GROUPS){
    const {standings}=calcStandings(g,LATEST_MATCHES);
    const codes=[...GROUPS[g]].sort((a,b)=>standings[b].pts-standings[a].pts||(standings[b].gf-standings[b].ga)-(standings[a].gf-standings[a].ga));
    seeds[`1${g}`]=codes[0];
    seeds[`2${g}`]=codes[1];
  }
  
  let html='';
  
  // R32
  html+=`<div class="bracket-row"><div class="bracket-label">R32</div>`;
  html+=`<div class="bracket-col">`;
  for(let i=0;i<8;i++){
    const sch=BRACKET_SCHEDULE.R32[i];
    const {s1,s2}=sch;
    const c1=seeds[s1]||s1, c2=seeds[s2]||s2;
    const m=LATEST_MATCHES.find(x=>(x.c1===c1&&x.c2===c2)||(x.c1===c2&&x.c2===c1));
    const sc=LATEST_SCORES[c1+'_'+c2]||[null,null,'upcoming'];
    const isTur=c1==='TUR'||c2==='TUR';
    html+=`<div class="match-box${m&&(sc[2].includes('LIVE')||sc[2]==='HT')?' live':''}${m&&sc[2]==='FT'?' ft':''}${isTur?' tur':''}" onclick="openMatchOverlay('${c1}','${c2}')">
      <div class="match-teams">${c1}-${c2}</div>
      <div class="match-score">${sc[0]!=null?sc[0]+'-'+sc[1]:''}</div>
      <div class="match-meta">${sch.date}<br>${sch.stadium}</div>
    </div>`;
  }
  html+=`</div></div>`;
  
  // R16
  html+=`<div class="bracket-row"><div class="bracket-label">R16</div><div class="bracket-col">`;
  for(let i=0;i<8;i++){
    const sch=BRACKET_SCHEDULE.R16[i];
    html+=`<div class="match-box"><div class="match-meta">${sch.date}<br>${sch.stadium}</div></div>`;
  }
  html+=`</div></div>`;
  
  // QF
  html+=`<div class="bracket-row"><div class="bracket-label">QF</div><div class="bracket-col">`;
  for(let i=0;i<4;i++){
    const sch=BRACKET_SCHEDULE.QF[i];
    html+=`<div class="match-box"><div class="match-meta">${sch.date}<br>${sch.stadium}</div></div>`;
  }
  html+=`</div></div>`;
  
  // SF
  html+=`<div class="bracket-row"><div class="bracket-label">SF</div><div class="bracket-col">`;
  for(let i=0;i<2;i++){
    const sch=BRACKET_SCHEDULE.SF[i];
    html+=`<div class="match-box"><div class="match-meta">${sch.date}<br>${sch.stadium}</div></div>`;
  }
  html+=`</div></div>`;
  
  // Final
  html+=`<div class="bracket-row"><div class="bracket-label">🏆 FINAL</div><div class="bracket-col">`;
  const fsch=BRACKET_SCHEDULE.Final[0];
  html+=`<div class="match-box" style="border-color:var(--gold)"><div class="match-meta">${fsch.date}<br>${fsch.stadium}</div></div>`;
  html+=`</div></div>`;
  
  document.getElementById('bracket-container').innerHTML=html;
}

async function fetchNews(){
  let wc=[];
  try{
    const r=await fetch(ESPN_NEWS,{cache:'no-store'});
    for(const a of ((await r.json()).articles||[])){
      wc.push(a.headline||'');
    }
  }catch(e){}
  if(!wc.length)wc=["France advance to semifinals","Türkiye surprise in R16","England battle back","Brazil's campaign","Argentina dominate"];
  wc.push("Design by Tuncer");
  return wc.slice(0,10);
}

function renderNews(news){
  const s=news.map(h=>`<span class="ti">${h}</span>`).join('');
  document.getElementById('news-track').innerHTML=s+s;
}

const FINAL=new Date('2026-07-19T19:00:00Z');
function tick(){
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  const ap=h>=12?'PM':'AM',hh=h%12||12;
  document.getElementById('clk').textContent=pad(hh)+':'+pad(m)+':'+pad(s)+' '+ap;
  const mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dt').textContent=mos[now.getMonth()]+' '+now.getDate();
  let diff=FINAL-now;
  if(diff<=0){document.getElementById('cd').textContent='🏆 FINAL!';return;}
  const d=Math.floor(diff/86400000);diff%=86400000;
  const h2=Math.floor(diff/3600000);diff%=3600000;
  const m2=Math.floor(diff/60000);diff%=60000;
  const s2=Math.floor(diff/1000);
  document.getElementById('cd').textContent=d+'d '+pad(h2)+'h '+pad(m2)+'m '+pad(s2)+'s';
}

let CUR_OVERLAY=null;
function openOverlay(html){
  document.getElementById('overlay-content').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
  CUR_OVERLAY=true;
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('open');
  CUR_OVERLAY=null;
}

function openTeamOverlay(code){
  const topTeams=[];
  for(const g in GROUPS){
    const {standings}=calcStandings(g,LATEST_MATCHES);
    for(const c of GROUPS[g]){
      if(standings[c]) topTeams.push({code:c,pts:standings[c].pts,gd:standings[c].gf-standings[c].ga,history:standings[c].history});
    }
  }
  const team=topTeams.find(t=>t.code===code);
  if(!team)return;
  
  let html=`<div class="ov-title">${FLAG[code]||''} ${FULL_NAME[code]}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Pts: ${team.pts} | GD: ${team.gd>0?'+':''}${team.gd}</div>
    <div class="ov-section">Tournament History</div>
    <div class="match-history">`;
  
  if(team.history){
    for(const h of team.history){
      html+=`<div class="history-item${h.s1>h.s2?' ft':''}">
        <div class="hi-teams">${code} <strong>${h.s1}-${h.s2}</strong> ${h.opp}</div>
        <div class="hi-meta">${h.date?new Date(h.date).toLocaleDateString():'--'}</div>
      </div>`;
    }
  }
  html+=`</div>`;
  openOverlay(html);
}

function openScorerOverlay(name,team){
  const scorer=LAST_SCORERS.find(s=>s.name===name&&s.team===team);
  if(!scorer)return;
  
  const club=CLUB_CACHE[name]||'Club TBD';
  let html=`<div class="ov-title">${name}</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:4px">${FLAG[team]||''} ${FULL_NAME[team]}</div>
    <div style="font-size:12px;color:var(--gold2);margin-bottom:12px;font-style:italic">${club}</div>
    <div style="font-size:28px;font-weight:700;color:var(--gold);text-align:center;margin:12px 0">${scorer.goals} GOALS</div>
    <div class="ov-section">Goal Breakdown</div>
    <div class="match-history">`;
  
  if(scorer.matches){
    for(const m of scorer.matches){
      html+=`<div class="history-item ft">
        <div class="hi-teams">vs ${m.opp}</div>
        <div class="hi-meta">${m.date?new Date(m.date).toLocaleDateString():'--'}</div>
      </div>`;
    }
  }
  html+=`</div>`;
  openOverlay(html);
}

function openMatchOverlay(c1,c2){
  const m=LATEST_MATCHES.find(x=>(x.c1===c1&&x.c2===c2)||(x.c1===c2&&x.c2===c1));
  const sc=LATEST_SCORES[c1+'_'+c2]||[null,null,'upcoming'];
  
  let html=`<div class="ov-title">${c1} - ${c2}</div>`;
  
  if(m){
    html+=`<div style="font-size:24px;font-weight:700;text-align:center;color:var(--gold);margin:12px 0">${sc[0]}–${sc[1]}</div>
      <div style="text-align:center;color:var(--muted);margin-bottom:16px">${m.venue||'--'} · ${m.stadium||'--'}</div>`;
    
    if(m.events&&m.events.length){
      html+=`<div class="ov-section">Match Events</div><div class="match-history">`;
      for(const ev of m.events){
        const ico=ev.type==='goal'?'⚽':(ev.type==='yellow'?'🟨':'🟥');
        html+=`<div class="history-item ft"><div class="hi-teams">${ico} ${ev.name} (${ev.time})</div></div>`;
      }
      html+=`</div>`;
    }
  }
  
  openOverlay(html);
}

let AUDIO_ON=false,audioCtx=null;
function ensureCtx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function chime(){if(!AUDIO_ON)return;const ctx=ensureCtx();[880,1175,1480].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime+i*0.12);g.gain.linearRampToValueAtTime(0.15,ctx.currentTime+i*0.14);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.4);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.4);});}
function enableAudio(){AUDIO_ON=true;ensureCtx();document.getElementById('audio-enable').style.display='none';document.getElementById('audio-toggle').style.display='flex';chime();}
function toggleMute(){AUDIO_ON=!AUDIO_ON;document.getElementById('audio-toggle').textContent=AUDIO_ON?'🔊':'🔇';}

let LATEST_MATCHES=[],LATEST_SCORES={};
async function refresh(){
  const eb=document.getElementById('err-banner');
  try{
    const {matches,scores}=await fetchAllMatches();
    if(!matches.length)throw new Error('no data');
    LATEST_MATCHES=matches;LATEST_SCORES=scores;
    const news=await fetchNews();
    
    renderTeamsPanel();
    renderTodayMatches();
    renderScorersPanel();
    renderBracket();
    renderNews(news);
    
    const now=new Date();
    document.getElementById('upd').textContent='Updated: '+now.toLocaleTimeString();
    document.getElementById('loading').style.display='none';
    eb.style.display='none';
    return 600000;
  }catch(e){
    console.error('fetch failed',e);
    eb.style.display='block';
    eb.textContent='⚠ Data fetch failed';
    document.getElementById('loading').style.display='none';
    return 60000;
  }
}

async function loop(){
  const wait=await refresh();
  setTimeout(loop,wait);
}

setInterval(tick,1000);tick();
setInterval(renderTodayMatches,30000);
loop();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay();});
</script>
