<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>FIFA World Cup 2026 - Live Bracket</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFD700;--gold2:#FFA500;--green:#00c97a;--blue:#4a9eff;--live:#E31937;--bg:#07101f;--bg2:#0f1c30;--bg3:#162340;--border:#1e2f4a;--text:#dde5f5;--muted:#5a7090}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Roboto Condensed',sans-serif;overflow:hidden}

#hdr{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--bg2) 0%,#091528 100%);border-bottom:2px solid var(--gold);padding:8px 14px;height:54px;gap:8px}
.hl{display:flex;align-items:center;gap:10px}
.trophy{font-size:26px}
.tm{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:1px}
.ts{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.hr{text-align:right;flex-shrink:0}
#clk{font-family:'Oswald',sans-serif;font-size:18px;color:var(--text)}
#upd{font-size:9px;color:#2a3a55;margin-top:2px}

#body{display:flex;height:calc(100vh - 54px - 144px);overflow:hidden}
#bracket-area{flex:1;overflow-x:auto;overflow-y:hidden;padding:12px}
.bracket-container{display:flex;gap:16px;min-width:min-content;height:100%}

.round{display:flex;flex-direction:column;justify-content:space-around;flex-shrink:0}
.round-r32{min-width:280px}.round-qf{min-width:336px}.round-sf{min-width:392px}.round-final{min-width:448px}

.round-title{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;text-align:center;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px}

.match-box{background:linear-gradient(135deg,var(--bg2),rgba(15,28,48,.8));border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all 0.3s;position:relative}
.match-box:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,.2);transform:translateY(-2px)}
.match-box.live{border:2px solid var(--live);box-shadow:0 0 16px rgba(227,25,55,.3)}
.match-box.ft{border:1px solid var(--green)}

.round-r32 .match-box{padding:5px;margin:6px 0}.round-r32 .team{display:flex;gap:3px;padding:3px 0;font-size:9px;align-items:center}
.round-r32 .flag{font-size:14px}.round-r32 .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:600;font-size:9px}
.round-r32 .score{font-size:11px;font-weight:800;color:var(--gold);font-family:'Courier New',monospace;min-width:18px;text-align:right}
.round-r32 .match-status{font-size:7px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:2px;text-transform:uppercase;padding-bottom:1px;border-bottom:1px solid var(--border)}

.round-qf .match-box{padding:7px;margin:9px 0}.round-qf .team{display:flex;gap:4px;padding:4px 0;font-size:10.8px;align-items:center}
.round-qf .flag{font-size:16px}.round-qf .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:600;font-size:10.8px}
.round-qf .score{font-size:13px;font-weight:800;color:var(--gold);font-family:'Courier New',monospace;min-width:20px;text-align:right}
.round-qf .match-status{font-size:8px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:3px;text-transform:uppercase;padding-bottom:2px;border-bottom:1px solid var(--border)}

.round-sf .match-box{padding:9px;margin:12px 0}.round-sf .team{display:flex;gap:5px;padding:5px 0;font-size:12.6px;align-items:center}
.round-sf .flag{font-size:18px}.round-sf .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:600;font-size:12.6px}
.round-sf .score{font-size:16px;font-weight:800;color:var(--gold);font-family:'Courier New',monospace;min-width:24px;text-align:right}
.round-sf .match-status{font-size:9px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:4px;text-transform:uppercase;padding-bottom:2px;border-bottom:1px solid var(--border)}

.round-final .match-box{padding:11px;margin:14px 0;border:2px solid var(--gold);box-shadow:0 0 20px rgba(255,215,0,.3)}
.round-final .team{display:flex;gap:6px;padding:6px 0;font-size:15px;align-items:center}
.round-final .flag{font-size:22px}.round-final .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:700;font-size:15px}
.round-final .score{font-size:20px;font-weight:800;color:var(--gold);font-family:'Courier New',monospace;min-width:28px;text-align:right}
.round-final .match-status{font-size:10px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;padding-bottom:3px;border-bottom:2px solid var(--gold)}

.live-dot{display:inline-block;width:6px;height:6px;background:var(--live);border-radius:50%;margin-right:4px;animation:pulse-live 1s infinite}
@keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.4}}

#tickers{height:144px;background:var(--bg2);border-top:2px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.trow{display:flex;align-items:center;height:48px;overflow:hidden;border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:none}
.tlabel{flex-shrink:0;width:150px;font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:0 12px;border-right:2px solid var(--border);height:100%;display:flex;align-items:center}
.tlabel.wc{color:var(--gold);background:rgba(255,215,0,.07)}.tlabel.tm{color:var(--blue);background:rgba(74,158,255,.07)}.tlabel.sc{color:var(--green);background:rgba(0,201,122,.07)}
.twrap{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.ttrack{display:flex;align-items:center;white-space:nowrap;animation:sl 50s linear infinite}
.ttrack.slow{animation-duration:62s}.ttrack.fast{animation-duration:40s}
.ti{font-size:17px;padding:0 32px;color:var(--text)}
.ti::before{content:"⚽  "}
@keyframes sl{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

#overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(3,8,18,.85);backdrop-filter:blur(3px);align-items:center;justify-content:center}
#overlay.open{display:flex}
#overlay-card{background:linear-gradient(160deg,var(--bg2),var(--bg));border:2px solid var(--gold);border-radius:12px;width:min(500px,94vw);max-height:80vh;overflow-y:auto;position:relative;box-shadow:0 12px 60px rgba(0,0,0,.7);padding:22px}
#overlay-close{position:absolute;top:12px;right:12px;width:32px;height:32px;background:var(--bg3);color:var(--gold);border:1px solid var(--border);border-radius:50%;font-size:18px;cursor:pointer;font-weight:bold}
#overlay-close:hover{border-color:var(--gold)}
.ov-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--gold);margin-bottom:16px;text-align:center}
.ov-teams{display:flex;justify-content:space-around;align-items:center;margin:20px 0;gap:20px}
.ov-team{text-align:center}
.ov-team-flag{font-size:48px;margin-bottom:8px}
.ov-team-name{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700}
.ov-score{font-family:'Oswald',sans-serif;font-size:32px;font-weight:800;color:var(--gold);letter-spacing:2px}
.ov-status{font-size:12px;color:var(--gold);font-weight:700;text-transform:uppercase;text-align:center;margin:16px 0}
.ov-time{font-size:11px;color:var(--muted);text-align:center}

#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.lt{font-family:'Oswald',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;margin-top:10px}

#bracket-area::-webkit-scrollbar{height:6px}
#bracket-area::-webkit-scrollbar-track{background:var(--bg2)}
#bracket-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#bracket-area::-webkit-scrollbar-thumb:hover{background:var(--gold)}
</style>
</head>
<body>

<div id="loading">
  <div style="font-size:60px;animation:bounce 1.5s infinite">🏆</div>
  <div class="lt">FIFA WC 2026 Bracket</div>
</div>

<div id="hdr">
  <div class="hl">
    <div class="trophy">🏆</div>
    <div>
      <div class="tm">FIFA <span style="color:var(--live)">WC</span> 2026</div>
      <div class="ts">Knockout Stage - Click Match for Details</div>
    </div>
  </div>
  <div class="hr">
    <div id="clk">--:--</div>
    <div id="upd">Loading...</div>
  </div>
</div>

<div id="body">
  <div id="bracket-area">
    <div class="bracket-container" id="bracket"></div>
  </div>
</div>

<div id="tickers">
  <div class="trow">
    <div class="tlabel wc">World Cup News</div>
    <div class="twrap"><div class="ttrack" id="wc-track"></div></div>
  </div>
  <div class="trow">
    <div class="tlabel tm">Top 8 Teams</div>
    <div class="twrap"><div class="ttrack slow" id="tm-track"></div></div>
  </div>
  <div class="trow">
    <div class="tlabel sc">Top 8 Scorers</div>
    <div class="twrap"><div class="ttrack fast" id="sc-track"></div></div>
  </div>
</div>

<div id="overlay">
  <div id="overlay-card">
    <div id="overlay-close">✕</div>
    <div id="overlay-content"></div>
  </div>
</div>

<script>
const EMOJIS={'USA':'🇺🇸','MEX':'🇲🇽','CAN':'🇨🇦','ARG':'🇦🇷','BRA':'🇧🇷','FRA':'🇫🇷','ENG':'🇬🇧','ESP':'🇪🇸','GER':'🇩🇪','ITA':'🇮🇹','NLD':'🇳🇱','BEL':'🇧🇪','POR':'🇵🇹','SWE':'🇸🇪','POL':'🇵🇱','CRO':'🇭🇷','JPN':'🇯🇵','KOR':'🇰🇷','AUS':'🇦🇺','NZL':'🇳🇿'};

let matchData={};

// Simple bracket template - will be populated with real data
const ROUNDS=[
  {name:'Round of 32',class:'round-r32',teams:[['USA','MEX'],['CAN','ARG'],['BRA','FRA'],['ENG','ESP'],['GER','ITA'],['NLD','BEL'],['POR','SWE'],['POL','CRO'],['JPN','KOR'],['AUS','NZL'],[],[],[],[],[],[]]},
  {name:'Quarterfinals',class:'round-qf',teams:[[],[],[],[],[],[],[],[]]},
  {name:'Semifinals',class:'round-sf',teams:[[],[],[],[]]},
  {name:'Final',class:'round-final',teams:[[],[]]},
];

async function fetchData(){
  try{
    const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa-world-cup');
    const j=await r.json();
    
    matchData={};
    const teams={};
    const news=j.articles||[];
    
    // Parse all matches
    if(j.events){
      for(const e of j.events){
        const[h,a]=e.competitors||[];
        if(!h||!a)continue;
        
        const c1=h.team.abbreviation;
        const c2=a.team.abbreviation;
        const s1=parseInt(h.score)||0;
        const s2=parseInt(a.score)||0;
        const st=e.status.type.name;
        const status=st.includes('LIVE')||st.includes('IN_PROGRESS')?'LIVE':st.includes('HALFTIME')?'HT':st.includes('FINAL')||st.includes('COMPLETE')?'FT':'upcoming';
        
        const key=`${c1}-${c2}`;
        matchData[key]={c1,c2,s1,s2,status,name1:h.team.displayName,name2:a.team.displayName,date:new Date(e.date)};
        
        // Track teams
        if(!teams[c1])teams[c1]={name:h.team.displayName,pts:0,gf:0,ga:0};
        if(!teams[c2])teams[c2]={name:a.team.displayName,pts:0,gf:0,ga:0};
        
        teams[c1].gf+=s1;
        teams[c1].ga+=s2;
        teams[c2].gf+=s2;
        teams[c2].ga+=s1;
        
        if(status==='FT'){
          if(s1>s2) teams[c1].pts+=3;
          else if(s2>s1) teams[c2].pts+=3;
          else{teams[c1].pts++;teams[c2].pts++;}
        }
      }
    }
    
    return {news,teams};
  }catch(e){
    console.error('Fetch failed:',e);
    return {news:[],teams:{}};
  }
}

function getMatch(c1,c2){
  return matchData[`${c1}-${c2}`]||matchData[`${c2}-${c1}`]||null;
}

function renderBracket(){
  let h='';
  for(const r of ROUNDS){
    h+=`<div class="round ${r.class}"><div class="round-title">${r.name}</div>`;
    for(const team of r.teams){
      const c1=team[0]||'';
      const c2=team[1]||'';
      const match=getMatch(c1,c2);
      const isLive=match&&(match.status==='LIVE'||match.status==='HT');
      const isFT=match&&match.status==='FT';
      const s1=match?match.s1:0;
      const s2=match?match.s2:0;
      const onclick=c1&&c2?`onclick="showMatch('${c1}','${c2}')":'';
      
      h+=`<div class="match-box ${isLive?'live':''}${isFT?'ft':''}" ${onclick} style="cursor:${c1?'pointer':'default'}">
        <div class="match-status">${isLive?'<span class="live-dot"></span>LIVE':isFT?'FT':c1?'vs':'TBD'}</div>
        <div class="team"><span class="flag">${EMOJIS[c1]||'🏳️'}</span><span class="name">${c1||'TBD'}</span><span class="score">${c1?s1:'-'}</span></div>
        <div class="team"><span class="flag">${EMOJIS[c2]||'🏳️'}</span><span class="name">${c2||'TBD'}</span><span class="score">${c2?s2:'-'}</span></div>
      </div>`;
    }
    h+='</div>';
  }
  document.getElementById('bracket').innerHTML=h;
}

function renderTickers(news,teams){
  const newsText=news.length>0?news.slice(0,8).map(n=>n.description||n.headline).join(' • '):'⚽ World Cup 2026 Live Updates';
  document.getElementById('wc-track').innerHTML=`<div class="ti">${newsText}</div><div class="ti">${newsText}</div>`;
  
  const topTeams=Object.entries(teams).sort((a,b)=>b[1].pts-a[1].pts).slice(0,8).map(([c,t])=>`${EMOJIS[c]||'🏳️'} ${c} (${t.pts}pts)`).join(' • ')||'Loading teams...';
  document.getElementById('tm-track').innerHTML=`<div class="ti">${topTeams}</div><div class="ti">${topTeams}</div>`;
  
  const topScorers=Object.entries(teams).sort((a,b)=>b[1].gf-a[1].gf).slice(0,8).map(([c,t])=>`${EMOJIS[c]||'🏳️'} ${c} - ${t.gf}G`).join(' • ')||'No goals yet';
  document.getElementById('sc-track').innerHTML=`<div class="ti">${topScorers}</div><div class="ti">${topScorers}</div>`;
}

function showMatch(c1,c2){
  const match=getMatch(c1,c2);
  if(!match)return;
  const html=`
    <div class="ov-title">Match Details</div>
    <div class="ov-teams">
      <div class="ov-team"><div class="ov-team-flag">${EMOJIS[c1]||'🏳️'}</div><div class="ov-team-name">${match.name1}</div></div>
      <div style="text-align:center"><div class="ov-score">${match.s1}-${match.s2}</div><div class="ov-status">${match.status}</div></div>
      <div class="ov-team"><div class="ov-team-flag">${EMOJIS[c2]||'🏳️'}</div><div class="ov-team-name">${match.name2}</div></div>
    </div>
    <div class="ov-time">${match.date.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
  `;
  document.getElementById('overlay-content').innerHTML=html;
  document.getElementById('overlay').classList.add('open');
}

function tick(){
  const now=new Date();
  document.getElementById('clk').textContent=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

document.getElementById('overlay-close').onclick=()=>document.getElementById('overlay').classList.remove('open');
document.getElementById('overlay').onclick=(e)=>{if(e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open')};

async function refresh(){
  try{
    const {news,teams}=await fetchData();
    renderBracket();
    renderTickers(news,teams);
    document.getElementById('loading').style.display='none';
    document.getElementById('upd').textContent='Updated: '+new Date().toLocaleTimeString();
    
    const isLive=Object.values(matchData).some(m=>m.status==='LIVE');
    return isLive?30000:30*60*1000;
  }catch(e){
    console.error('Refresh error:',e);
    return 60000;
  }
}

async function loop(){
  const wait=await refresh();
  setTimeout(loop,wait);
}

setInterval(tick,1000);tick();
loop();
</script>
</body>
</html>
