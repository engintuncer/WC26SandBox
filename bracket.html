<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#07101f">
<title>World Cup 2026 - Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #FFD700;
  --gold2: #FFA500;
  --live: #E31937;
  --green: #00c97a;
  --blue: #4a9eff;
  --bg: #07101f;
  --bg2: #0f1c30;
  --border: #1e2f4a;
  --text: #dde5f5;
  --muted: #5a7090;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Roboto Condensed', sans-serif;
  overflow: hidden;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, var(--bg2) 0%, #091528 100%);
  border-bottom: 3px solid var(--gold);
  padding: 8px 14px;
  height: 54px;
  gap: 20px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.trophy {
  font-size: 26px;
}

.title {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 1px;
}

.subtitle {
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.header-center {
  flex: 1;
  text-align: center;
}

.stage-label {
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.header-right {
  display: flex;
  gap: 30px;
  align-items: center;
  flex-shrink: 0;
}

.nav-links {
  display: flex;
  gap: 20px;
}

.nav-links a {
  color: var(--text);
  text-decoration: none;
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 3px;
  transition: all 0.3s;
}

.nav-links a:hover {
  color: var(--gold);
  background: rgba(255, 215, 0, 0.1);
}

.nav-links a.active {
  color: var(--gold);
  background: rgba(255, 215, 0, 0.2);
  border-bottom: 2px solid var(--gold);
}

.header-info {
  text-align: right;
  font-size: 10px;
}

.clock {
  font-family: 'Oswald', sans-serif;
  font-size: 16px;
  color: var(--text);
  font-weight: 400;
}

.update-time {
  font-size: 8px;
  color: var(--muted);
  margin-top: 2px;
}

/* Main Container */
main {
  height: calc(100vh - 54px);
  overflow-x: auto;
  overflow-y: hidden;
  background: var(--bg);
  padding: 12px;
}

.bracket-container {
  display: flex;
  gap: 20px;
  min-width: min-content;
  height: 100%;
  padding-right: 20px;
}

/* Round Column */
.round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  flex-shrink: 0;
  min-width: 200px;
}

.round-label {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* Match Box */
.match-box {
  background: linear-gradient(135deg, var(--bg2) 0%, rgba(15, 28, 48, 0.8) 100%);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px;
  margin: 6px 0;
  transition: all 0.3s ease;
  cursor: pointer;
  position: relative;
}

.match-box:hover {
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
  transform: translateY(-2px);
}

.match-box.live {
  border: 2px solid var(--live);
  background: linear-gradient(135deg, rgba(227, 25, 55, 0.1) 0%, rgba(15, 28, 48, 0.8) 100%);
  box-shadow: 0 0 16px rgba(227, 25, 55, 0.3);
}

.match-box.final {
  border: 2px solid var(--gold);
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}

.live-indicator {
  position: absolute;
  top: 4px;
  right: 4px;
  background: var(--live);
  color: white;
  font-size: 7px;
  font-weight: 700;
  padding: 2px 4px;
  border-radius: 2px;
  animation: pulse-indicator 1s infinite;
  letter-spacing: 0.5px;
}

@keyframes pulse-indicator {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.match-status {
  font-size: 7px;
  color: var(--gold);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  padding-bottom: 2px;
}

.team-line {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 0;
  font-size: 9px;
  font-family: 'Oswald', sans-serif;
}

.team-flag {
  font-size: 12px;
  flex-shrink: 0;
}

.team-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
  font-weight: 600;
  font-size: 8px;
}

.team-score {
  font-size: 14px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 1px;
  min-width: 24px;
  text-align: right;
  font-family: 'Courier New', monospace;
}

.team-score.pending {
  color: var(--muted);
  font-size: 12px;
}

.match-time {
  font-size: 7px;
  color: var(--muted);
  text-align: center;
  margin-top: 4px;
  padding-top: 3px;
  border-top: 1px solid var(--border);
}

/* Winner Badge */
.winner {
  background: rgba(0, 201, 122, 0.15);
  border-left: 2px solid var(--green);
}

.tbd {
  background: rgba(90, 112, 144, 0.1);
}

/* Loading */
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 14px;
}

.trophy-big {
  font-size: 60px;
  animation: bounce 1.5s infinite;
}

.loading-text {
  font-family: 'Oswald', sans-serif;
  font-size: 22px;
  color: var(--gold);
  letter-spacing: 2px;
}

.loading-sub {
  font-size: 13px;
  color: var(--muted);
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

#err-banner {
  display: none;
  position: fixed;
  bottom: 10px;
  left: 10px;
  right: 10px;
  background: #4a0a0a;
  border: 1px solid var(--live);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 11px;
  color: #ff9a9a;
  z-index: 50;
}

/* Scrollbar Styling */
main::-webkit-scrollbar {
  height: 6px;
}

main::-webkit-scrollbar-track {
  background: var(--bg2);
}

main::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

main::-webkit-scrollbar-thumb:hover {
  background: var(--gold);
}

/* Responsive */
@media (max-width: 1024px) {
  .round {
    min-width: 180px;
  }

  .team-name {
    font-size: 7px;
  }

  .team-score {
    font-size: 12px;
  }
}
</style>
</head>
<body>

<div id="loading">
  <div class="trophy-big">🏆</div>
  <div class="loading-text">FIFA WC 2026</div>
  <div class="loading-sub">Loading Bracket...</div>
</div>

<header>
  <div class="header-left">
    <div class="trophy">🏆</div>
    <div>
      <div class="title">FIFA <span style="color: var(--live)">WC</span> 2026</div>
      <div class="subtitle">Knockout Stage</div>
    </div>
  </div>
  <div class="header-center">
    <div class="stage-label" id="stage-info">Round of 32 → Final</div>
  </div>
  <div class="header-right">
    <div class="nav-links">
      <a href="index.html">Groups</a>
      <a href="bracket.html" class="active">Bracket</a>
    </div>
    <div class="header-info">
      <div class="clock" id="clock">--:--</div>
      <div class="update-time" id="update-time">Loading...</div>
    </div>
  </div>
</header>

<main>
  <div class="bracket-container" id="bracket">
    <!-- Dynamically populated -->
  </div>
</main>

<div id="err-banner"></div>

<script>
const EMOJIS = {
  'USA': '🇺🇸', 'MEX': '🇲🇽', 'CAN': '🇨🇦', 'ARG': '🇦🇷', 'BRA': '🇧🇷', 'FRA': '🇫🇷',
  'ENG': '🇬🇧', 'ESP': '🇪🇸', 'GER': '🇩🇪', 'ITA': '🇮🇹', 'NLD': '🇳🇱', 'BEL': '🇧🇪',
  'POR': '🇵🇹', 'SWE': '🇸🇪', 'POL': '🇵🇱', 'CRO': '🇭🇷', 'JPN': '🇯🇵', 'KOR': '🇰🇷',
  'AUS': '🇦🇺', 'NZL': '🇳🇿', 'CHN': '🇨🇳', 'VIE': '🇻🇳', 'THA': '🇹🇭', 'IRN': '🇮🇷',
  'KSA': '🇸🇦', 'EGY': '🇪🇬', 'SEN': '🇸🇳', 'GHA': '🇬🇭', 'CMR': '🇨🇲', 'NGA': '🇳🇬',
  'CIV': '🇨🇮', 'TUN': '🇹🇳', 'MAR': '🇲🇦', 'ZAF': '🇿🇦', 'UKR': '🇺🇦', 'ISR': '🇮🇱'
};

let latestMatches = [];

// Simulated bracket structure (in real implementation, derive from ESPN data)
const BRACKET_GROUPS = [
  {
    name: 'Round of 32',
    matches: [
      { id: 1, c1: 'USA', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 2, c1: 'MEX', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 3, c1: 'CAN', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 4, c1: 'ARG', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 5, c1: 'BRA', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 6, c1: 'FRA', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 7, c1: 'ENG', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 8, c1: 'ESP', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 9, c1: 'GER', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 10, c1: 'ITA', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 11, c1: 'NLD', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 12, c1: 'BEL', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 13, c1: 'POR', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 14, c1: 'SWE', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 15, c1: 'POL', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 16, c1: 'CRO', c2: '', s1: 0, s2: 0, status: 'upcoming' }
    ]
  },
  {
    name: 'Quarterfinals',
    matches: [
      { id: 'qf1', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'qf2', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'qf3', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'qf4', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'qf5', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'qf6', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'qf7', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'qf8', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' }
    ]
  },
  {
    name: 'Semifinals',
    matches: [
      { id: 'sf1', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'sf2', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'sf3', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' },
      { id: 'sf4', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' }
    ]
  },
  {
    name: 'Final',
    matches: [
      { id: 'final', c1: '', c2: '', s1: 0, s2: 0, status: 'upcoming' }
    ]
  }
];

async function fetchMatches() {
  try {
    const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa-world-cup');
    const json = await res.json();
    const matches = [];
    for (const e of json.events || []) {
      const [h, a] = e.competitors || [];
      if (!h || !a) continue;
      const status = e.status.type.name.includes('LIVE') || e.status.type.name === 'IN_PROGRESS' ? 'LIVE'
        : e.status.type.name === 'HALFTIME' ? 'HT'
        : e.status.type.name === 'FINAL' || e.status.type.name === 'COMPLETE' ? 'FT'
        : 'upcoming';
      matches.push({
        c1: h.team.abbreviation,
        c2: a.team.abbreviation,
        s1: parseInt(h.score) || 0,
        s2: parseInt(a.score) || 0,
        ptd: new Date(e.date),
        status: status
      });
    }
    latestMatches = matches;
    return matches;
  } catch (e) {
    console.error('Fetch failed:', e);
    return [];
  }
}

function renderBracket(matches) {
  let html = '';
  for (const round of BRACKET_GROUPS) {
    html += `<div class="round"><div class="round-label">${round.name}</div>`;
    for (const match of round.matches) {
      const isLive = match.status === 'LIVE' || match.status === 'HT';
      const isFinal = round.name === 'Final';
      const isFT = match.status === 'FT';
      const hasTeams = match.c1 && match.c2;
      
      let matchClass = hasTeams ? '' : 'tbd';
      if (isLive) matchClass += ' live';
      if (isFinal && match.c1) matchClass += ' final';
      if (isFT && match.c1) matchClass += ' winner';

      const liveTag = isLive ? '<div class="live-indicator">● LIVE</div>' : '';
      const statusText = match.status === 'FT' ? 'FT' : isLive ? match.status : 'vs';
      
      html += `<div class="match-box ${matchClass}">
        ${liveTag}
        <div class="match-status">${statusText}</div>
        <div class="team-line">
          <span class="team-flag">${EMOJIS[match.c1] || '🏳️'}</span>
          <span class="team-name">${match.c1 || 'TBD'}</span>
          <span class="team-score ${!hasTeams ? 'pending' : ''}">${hasTeams ? match.s1 : '-'}</span>
        </div>
        <div class="team-line">
          <span class="team-flag">${EMOJIS[match.c2] || '🏳️'}</span>
          <span class="team-name">${match.c2 || 'TBD'}</span>
          <span class="team-score ${!hasTeams ? 'pending' : ''}">${hasTeams ? match.s2 : '-'}</span>
        </div>
        <div class="match-time">${match.ptd ? match.ptd.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : 'TBD'}</div>
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('bracket').innerHTML = html;
}

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('update-time').textContent = 'Updated: ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

async function refresh() {
  const eb = document.getElementById('err-banner');
  try {
    await fetchMatches();
    renderBracket(latestMatches);
    document.getElementById('loading').style.display = 'none';
    eb.style.display = 'none';
    const isLive = latestMatches.some(m => m.status === 'LIVE');
    return isLive ? 30000 : 30 * 60 * 1000; // 30s during games, 30m otherwise
  } catch (e) {
    console.error('Refresh failed:', e);
    eb.style.display = 'block';
    eb.textContent = '⚠ Data fetch failed — retrying...';
    return 60000;
  }
}

async function loop() {
  const wait = await refresh();
  setTimeout(loop, wait);
}

setInterval(tick, 1000);
tick();
loop();
</script>
</body>
</html>
